  <text x="130" y="96" style="fill:rgb(114, 9, 183);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Arial, Helvetica, sans-serif;font-size:12px;font-weight:400;text-anchor:start;dominant-baseline:auto">THE NORTH CAROLINA</text>
  <text x="130" y="116" style="fill:rgb(114, 9, 183);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Arial, Helvetica, sans-serif;font-size:12px;font-weight:400;text-anchor:start;dominant-baseline:auto">LAW OFFICE OF</text>

