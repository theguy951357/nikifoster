<svg width="100%" viewBox="0 0 680 300" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Foster for the People — Law Office of Niki Foster logo with F lettermark</title>
  <desc>Bold F lettermark in vibrant palette alongside Law Office of Niki Foster and tagline</desc>

  <style>
    .name { font-family: Georgia, 'Times New Roman', serif; font-size: 38px; font-weight: 700; fill: #7209b7; }
    .sub  { font-family: Arial, Helvetica, sans-serif; font-size: 11px; font-weight: 400; fill: #7209b7; letter-spacing: 3px; }
    .tag  { font-family: Georgia, 'Times New Roman', serif; font-size: 16px; font-weight: 700; fill: #f72585; letter-spacing: 2px; }
    .ltr  { font-family: Georgia, 'Times New Roman', serif; font-size: 112px; font-weight: 700; fill: #ffffff; }
  </style>

  <!-- Layered squares -->
  <rect x="48" y="58" width="130" height="180" rx="6" fill="#4cc9f0"/>
  <rect x="58" y="68" width="130" height="180" rx="6" fill="#3a0ca3"/>
  <rect x="68" y="78" width="130" height="180" rx="6" fill="#7209b7"/>
  <!-- Pink left accent bar -->
  <rect x="68" y="78" width="16" height="180" rx="4" fill="#f72585"/>

  <!-- F letterform -->
  <text x="110" y="185" class="ltr">F</text>
</svg>